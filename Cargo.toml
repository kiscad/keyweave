[workspace]
resolver = "3"
members = ["crates/keyweave-types", "crates/keyweave-engine", "crates/keyweave-config", "crates/keyweavectl", "crates/keyweave-output", "crates/keyweave-linux", "crates/keyweave-windows", "crates/keyweave-progress", "crates/keyweave-worker", "crates/keyweave-host", "crates/keyweave-x11-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
regex = { version = "=1.8.1", default-features = false, features = ["std", "unicode"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.19"
clap = { version = "=4.6.4", features = ["derive"] }
keyweave-types = { path = "crates/keyweave-types" }
keyweave-engine = { path = "crates/keyweave-engine" }
keyweave-config = { path = "crates/keyweave-config" }
keyweave-output = { path = "crates/keyweave-output" }

keyweave-progress = { path = "crates/keyweave-progress" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
