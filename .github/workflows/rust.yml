name: Rust
on: [push, pull_request]
jobs:
  workspace:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/basic.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/sequence.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/tap-alone.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/modifiers.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/output-shortcuts.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/device-context.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/text-context.json --assert
      - run: cargo run --locked -p keyweavectl -- replay --fixture tests/fixtures/variables.json --assert
